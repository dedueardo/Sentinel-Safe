version: '3.9'

services:
  traefik:
    image: "traefik:v2.10"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=danijrs1000@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - traefik_certs:/letsencrypt
    networks:
      - web

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sentinel_safe
      MYSQL_USER: sentinel
      MYSQL_PASSWORD: sentinel
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

  db-migrate:
    image: redarsene/sentinel-safe-db-migrate:latest
    depends_on:
      - db
    command: >
      /bin/sh -c "
        echo 'Waiting for MySQL server...';
        until mysqladmin ping -h db -u root -p$$MYSQL_ROOT_PASSWORD --silent; do
          echo -n '.'; sleep 2;
        done;
        echo ' DB is ready. Running all SQL scripts...';
        for f in /sql-scripts/*.sql; do
          echo \"Executing $$f...\";
          mysql -h db -u root -p$$MYSQL_ROOT_PASSWORD sentinel_safe < \"$$f\";
        done;
        echo 'All database scripts executed successfully.';
      "
    networks:
      - internal

  backend:
    image: redarsene/sentinel-safe-backend:latest
    depends_on:
      - db-migrate
    environment:
      DB_HOST: db
      DB_USER: sentinel
      DB_PASSWORD: sentinel
      DB_DATABASE: sentinel_safe
      PORT: 3000
      NODE_ENV: production
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sentinel-backend.rule=Host(`sentinel.mahoraga.cloud`) && (PathPrefix(`/api`) || PathPrefix(`/ws-status`))"
      - "traefik.http.routers.sentinel-backend.entrypoints=websecure"
      - "traefik.http.routers.sentinel-backend.tls.certresolver=myresolver"
      - "traefik.http.services.sentinel-backend.loadbalancer.server.port=3000"

  frontend:
    image: redarsene/sentinel-safe-frontend:latest
    depends_on:
      - backend
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sentinel-frontend.rule=Host(`sentinel.mahoraga.cloud`)"
      - "traefik.http.routers.sentinel-frontend.entrypoints=websecure"
      - "traefik.http.routers.sentinel-frontend.tls.certresolver=myresolver"
      - "traefik.http.services.sentinel-frontend.loadbalancer.server.port=80"

volumes:
  db_data:
  traefik_certs:


networks:
  internal:
    driver: overlay
  web:
    driver: overlay
