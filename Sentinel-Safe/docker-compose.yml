version: '3.9'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sentinel_safe
      MYSQL_USER: sentinel
      MYSQL_PASSWORD: sentinel
    volumes:
      # Volume para persistir os dados do banco de dados
      - db_data:/var/lib/mysql

      # INICIALIZAÇÃO: O MySQL executará este script automaticamente na primeira vez
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    image: redarsene/sentinel-safe-db-migrate:latest
    # CORREÇÃO: depends_on alterado para o formato de lista simples
    depends_on:
      - db
    restart: "no"
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      echo 'Waiting for MySQL server to be ready...';
      # Este loop de espera manual substitui a necessidade do "condition: service_healthy"
      until mysqladmin ping -h "db" -P 3306 -u"root" -p"$$MYSQL_ROOT_PASSWORD" --silent; do
        echo -n '.'; sleep 2;
      done;
      echo ' DB is ready. Running migrations...';
      set -e;
      # MIGRAÇÃO: Este loop executa os scripts da pasta /migrations que estão dentro da imagem.
      for f in /docker-entrypoint-migrations.d/*.sql; do
        if [ ! -f "$$f" ]; then echo "No migrations to run"; break; fi;
        echo "Running migration: $$f";
        mysql --protocol=tcp -h db -P 3306 -uroot -proot sentinel_safe < "$$f";
      done;
      echo 'Migrations completed successfully.';

  backend:
    image: redarsene/sentinel-safe-backend:latest
    restart: always
    # CORREÇÃO: depends_on alterado para o formato de lista simples
    depends_on:
      - db-migrate
    environment:
      DB_HOST: db
      DB_USER: sentinel
      DB_PASSWORD: sentinel
      DB_DATABASE: sentinel_safe
      PORT: 3000
      NODE_ENV: production
      # ... (suas outras variáveis de ambiente)
    ports:
      - '3000:3000'
      - '3100-3199:3100-3199'

  frontend:
    image: redarsene/sentinel-safe-frontend:latest
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:3000/api
      VITE_WS_URL: ws://backend:3000
    ports:
      - '5173:80'

volumes:
  db_data:
