version: '3.9'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sentinel_safe
      MYSQL_USER: sentinel
      MYSQL_PASSWORD: sentinel
    volumes:
      # Volume para persistir os dados do banco de dados
      - db_data:/var/lib/mysql

      # INICIALIZAÇÃO: Monta seu script init.sql. O MySQL o executará automaticamente
      # na primeira vez que o banco de dados for criado.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    # CORREÇÃO: Usa a imagem customizada que você deve criar, a qual contém seus scripts de migração.
    image: redarsene/sentinel-safe-db-migrate:latest
    depends_on:
      db:
        condition: service_healthy # Espera o DB estar 100% pronto antes de rodar as migrações
    restart: "no"
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      echo 'DB is healthy. Running migrations...';
      set -e;
      # MIGRAÇÃO: Este loop executa os scripts da pasta /migrations que estão dentro da imagem.
      for f in /docker-entrypoint-migrations.d/*.sql; do
        if [ ! -f "$$f" ]; then echo "No migrations to run"; break; fi;
        echo "Running migration: $$f";
        mysql --protocol=tcp -h db -P 3306 -uroot -proot sentinel_safe < "$$f";
      done;
      echo 'Migrations completed successfully.';

  backend:
    image: redarsene/sentinel-safe-backend:latest
    restart: always
    depends_on:
      db-migrate:
        condition: service_completed_successfully # SÓ INICIA DEPOIS que as migrações terminarem com sucesso
    environment:
      DB_HOST: db
      DB_USER: sentinel
      DB_PASSWORD: sentinel
      DB_DATABASE: sentinel_safe
      PORT: 3000
      NODE_ENV: production
      # ... (suas outras variáveis de ambiente)
    ports:
      - '3000:3000'
      - '3100-3199:3100-3199'

  frontend:
    image: redarsene/sentinel-safe-frontend:latest
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:3000/api
      VITE_WS_URL: ws://backend:3000
    ports:
      - '5173:80'

volumes:
  db_data:
